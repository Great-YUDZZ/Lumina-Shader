schema = 1
id = "lumina_shader"
name = "Lumina Shader"
version = "1.1"
api = "0.1"
description = "Warm Cinematic shader pack for Horizon: rich golden hour, aurora borealis night sky, cozy rain, quarter-res godrays & bloom, dynamic hand/offhand torch light, crystal water, and glowing ores. Tuned for 60 FPS on AMD Radeon 660M/680M."
authors = ["yudz"]
license = "MIT"
shared = ["common.wgsl", "lib/fog.wgsl"]

[sky]
file = "sky.wgsl"
name = "Warm Horizon Sky"
clouds = true
stars = false

[material]
file = "material.wgsl"
files = ["lib/lighting.wgsl", "lib/water.wgsl"]
name = "Terrain & Water"
fog = false

[weather]
file = "weather.wgsl"
name = "Rain & Snow"

[[post]]
file = "post/godrays.wgsl"
name = "Volumetric Godrays"
output = "rays"
scale = 0.25

[[post]]
file = "post/bloom_prefilter.wgsl"
name = "Bloom Prefilter"
output = "bloom_a"
scale = 0.25

[[post]]
file = "post/bloom.wgsl"
name = "Soft Bloom"
output = "bloom_b"
scale = 0.25

[[post]]
file = "post/grade.wgsl"
name = "ACES Warm Grade"

[shadow]
resolution = 1024
distance = 48.0
solid_materials = [10, 11]
option = "shadows"
resolution_option = "shadow_resolution"
distance_option = "shadow_distance"

[budget]
gpu_ms = 2.0

