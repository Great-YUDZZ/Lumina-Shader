# --- Options ---

[[options]]
id = "shadows"
name = "Shadows"
description = "Draw directional sun and moon shadows and enable volumetric shadow-mapped godrays."
type = "bool"
default = true

[[options]]
id = "shadow_resolution"
name = "Shadow Resolution"
description = "Shadow map resolution in texels. 1024 is fastest for 60 FPS on Radeon 660M; 2048 is sharper."
type = "choice"
values = ["1024", "2048"]
default = "1024"

[[options]]
id = "shadow_distance"
name = "Shadow Distance"
description = "Shadow reach in blocks. 48 cuts Jungle shadow geometry nearly in half while keeping close shadows sharp; 32 is fastest."
type = "choice"
values = ["32", "48", "64", "96"]
default = "48"

[[options]]
id = "sun_warmth"
name = "Sun Warmth"
description = "How golden the sunlight is, especially around sunrise and sunset."
type = "float"
default = 0.65
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "shadow_tint"
name = "Cool Shadow Tint"
description = "Subtle cool sky-blue tint in shadowed areas to contrast with warm sunlight."
type = "float"
default = 0.45
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "block_light_strength"
name = "Block Light Intensity"
description = "Strength of warm torches, lanterns, and colored block lights."
type = "float"
default = 1.15
min = 0.5
max = 2.0
step = 0.05

[[options]]
id = "handlight_strength"
name = "Hand Torch Light"
description = "Brightness of dynamic light when holding a torch or lantern in main hand or left hand (offhand)."
type = "float"
default = 1.25
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "godrays"
name = "Volumetric Godrays"
description = "Sunbeams filtered through trees and hills using the shadow map at quarter resolution."
type = "bool"
default = true

[[options]]
id = "godray_strength"
name = "Godray Intensity"
description = "Brightness of volumetric sun shafts and canopy sunbeams."
type = "float"
default = 0.75
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "aurora_strength"
name = "Aurora Borealis"
description = "Brightness of emerald-teal and violet aurora ribbons in the night sky."
type = "float"
default = 0.85
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "fog_strength"
name = "Morning / Dusk / Rain Fog"
description = "Atmospheric fog thickness at sunrise, sunset, and during rain (noon and caves stay clear)."
type = "float"
default = 0.55
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "night_darkness"
name = "Realistic Night Darkness"
description = "How dark unlit areas become at night and inside caves."
type = "float"
default = 0.75
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "water_clarity"
name = "Water Clarity"
description = "How clearly you can see refracted terrain underwater from above."
type = "float"
default = 0.75
min = 0.2
max = 1.0
step = 0.05

[[options]]
id = "water_specular"
name = "Water Sun Reflection"
description = "Intensity of glittering sun and moon reflections on water waves."
type = "float"
default = 0.7
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "wetness_enabled"
name = "Rain Surface Wetness"
description = "Darken and add glossy specular sheen to sky-exposed blocks when it rains."
type = "bool"
default = true

[[options]]
id = "ore_glow"
name = "Ore Glow in Darkness"
description = "How strongly mineral veins on ores (except coal) glow in dark caves."
type = "float"
default = 0.85
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "emissive_boost"
name = "Emissive Block Boost"
description = "Extra glow on lava, lanterns, torches, glowstone, and froglights."
type = "float"
default = 0.6
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "bloom_strength"
name = "Bloom Intensity"
description = "Soft light halo around the sun, lava, torches, and glowing ores."
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "exposure"
name = "Exposure"
description = "Overall brightness before ACES filmic tone mapping."
type = "float"
default = 1.0
min = 0.6
max = 1.6
step = 0.05

[[options]]
id = "contrast"
name = "Contrast"
description = "Midtone contrast in the final color grade."
type = "float"
default = 1.06
min = 0.8
max = 1.4
step = 0.02

[[options]]
id = "saturation"
name = "Saturation"
description = "Color richness in the final picture."
type = "float"
default = 1.10
min = 0.5
max = 1.6
step = 0.02
